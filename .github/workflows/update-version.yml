name: Update version.json

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version hash
        id: ver
        run: |
          # Short SHA of the commit that triggered this push
          HASH="${{ github.sha }}"
          SHORT="${HASH:0:8}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          echo "short=$SHORT"       >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Write version.json
              run: |
                echo "{\"version\":\"${{ steps.ver.outputs.short }}\",\"buildTime\":\"${{ steps.ver.outputs.build_time }}\"}" > version.json

      - name: Commit & push version.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          # Only commit if version.json actually changed
          git diff --staged --quiet || git commit -m "chore: update version.json [${{ steps.ver.outputs.short }}]"
          git push
